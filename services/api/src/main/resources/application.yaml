spring:
  application:
    name: shop-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${SPRING_DATASOURCE_USERNAME:shop}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      data-source-properties:
        options: "-c lock_timeout=3s"
  flyway:
    ignore-migration-patterns: "*:future,repeatable:missing"
    connect-retries: 12
    connect-retries-interval: 10s
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  session:
    timeout: ${shop.auth.idle-session-timeout}

shop:
  auth:
    public-origin: ${SHOP_PUBLIC_ORIGIN:}
    idle-session-timeout: 30m

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 16KB
  servlet:
    session:
      cookie:
        name: __Host-SESSION
        secure: true
        http-only: true
        same-site: lax
        path: /

springdoc:
  api-docs:
    enabled: false
  writer-with-order-by-keys: true

management:
  server:
    port: 8081
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

---
spring:
  config:
    activate:
      on-profile: "!dev"
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed
