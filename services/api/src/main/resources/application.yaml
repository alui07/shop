spring:
  application:
    name: shop-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${SPRING_DATASOURCE_USERNAME:shop}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      data-source-properties:
        options: "-c lock_timeout=3s"
  flyway:
    ignore-migration-patterns: "*:future,repeatable:missing"
    connect-retries: 12
    connect-retries-interval: 10s
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  session:
    timeout: ${shop.auth.idle-session-timeout}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    # The default event looks the session up on every request: a session store call, and a failure when it is down.
    publish-request-handled-events: false
  task:
    execution:
      pool:
        max-size: 8
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 15s
  modulith:
    events:
      republish-outstanding-events-on-restart: false
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: false
      staleness:
        published: 10m
        processing: 5m
        resubmitted: 5m

shop:
  auth:
    public-origin: ${SHOP_PUBLIC_ORIGIN:}
    idle-session-timeout: 30m
  payment:
    provider: ${SHOP_PAYMENT_PROVIDER:}
    webhook-secret: ${SHOP_PAYMENT_WEBHOOK_SECRET:}
  mail:
    from: orders@shop.test

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 16KB
  servlet:
    session:
      cookie:
        name: __Host-SESSION
        secure: true
        http-only: true
        same-site: lax
        path: /

springdoc:
  api-docs:
    enabled: false
  writer-with-order-by-keys: true

management:
  server:
    port: 8081
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

---
spring:
  config:
    activate:
      on-profile: "!dev"
logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed
