name: shop

x-host-user: &host-user "${HOST_UID:?set by make}:${HOST_GID:?set by make}"

# Secrets come from .cache/secrets/shop.env (make secrets) through `docker compose --env-file`;
# each service maps only the variables it needs.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?set by make}
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: dev-only-postgres-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: ${VALKEY_IMAGE:?set by make}
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --maxmemory 96mb --maxmemory-policy volatile-lru --save "" --appendonly no
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run make secrets}
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: ${POSTGRES_IMAGE:?set by make}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run make secrets}
    # tmpfs, so the realm is imported fresh on every start (--import-realm skips an existing realm)
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_DEV_IMAGE:?set by make}
    pull_policy: never
    entrypoint:
      - bash
      - -c
      - |
        : "$${SHOP_AUTH_CLIENT_SECRET:?}" "$${SHOP_PUBLIC_ORIGIN:?}" "$${SHOP_TEST_CUSTOMER_PASSWORD:?}" "$${SHOP_TEST_ADMIN_PASSWORD:?}"
        exec /opt/keycloak/bin/kc.sh "$$@"
      - kc
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run make secrets}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run make secrets}
      SHOP_PUBLIC_ORIGIN: http://localhost:5173
      SHOP_AUTH_CLIENT_SECRET: ${SHOP_AUTH_CLIENT_SECRET:?run make secrets}
      SHOP_TEST_CUSTOMER_PASSWORD: ${SHOP_TEST_CUSTOMER_PASSWORD:?run make secrets}
      SHOP_TEST_ADMIN_PASSWORD: ${SHOP_TEST_ADMIN_PASSWORD:?run make secrets}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ../k8s/overlays/local/keycloak/shop-users-0.json:/opt/keycloak/data/import/shop-users-0.json:ro
    healthcheck:
      # The image has no curl or wget: bash /dev/tcp against the management port. Check the status line: a DOWN body still contains an "UP" check.
      test:
        - CMD-SHELL
        - |-
          exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mailpit:
    image: ${MAILPIT_IMAGE:?set by make}
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${MAVEN_IMAGE:?set by make}
    user: *host-user
    working_dir: /workspace
    entrypoint: ["mvn"]
    command: ${MVN_ARGS:?set by make} spring-boot:run
    environment:
      HOME: /cache/home
      SPRING_PROFILES_ACTIVE: dev,seed
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: dev-only-postgres-password
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PASSWORD: ${VALKEY_PASSWORD:?run make secrets}
      SHOP_PUBLIC_ORIGIN: http://localhost:5173
      SHOP_AUTH_ISSUER: http://localhost:8180/realms/shop
      SHOP_AUTH_INTERNAL_REALM_URL: http://keycloak:8080/realms/shop
      SHOP_AUTH_CLIENT_ID: shop-api
      SHOP_AUTH_CLIENT_SECRET: ${SHOP_AUTH_CLIENT_SECRET:?run make secrets}
      SHOP_PAYMENT_PROVIDER: fake
      SHOP_PAYMENT_WEBHOOK_SECRET: ${SHOP_PAYMENT_WEBHOOK_SECRET:?run make secrets}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    volumes:
      - ../../services/api:/workspace
      - ../../.cache/m2:/cache/m2
      - ../../.cache/home:/cache/home
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    image: ${WEB_TOOLS_IMAGE:?set by make}
    pull_policy: never
    user: *host-user
    working_dir: /app
    command: ["pnpm", "run", "dev"]
    environment:
      HOME: /cache/home
      API_PROXY_TARGET: http://api:8080
      pnpm_config_store_dir: /cache/pnpm
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../../apps/web:/app
      - ../../.cache/pnpm:/cache/pnpm
      - ../../.cache/home:/cache/home
    depends_on:
      api:
        condition: service_started

  # Grafana, Prometheus, Tempo, Loki and a collector in one container; only with `make dev OBS=1` (profile obs). OTLP/HTTP on 4318 stays on the compose network.
  otel-lgtm:
    image: ${OTEL_LGTM_IMAGE:?set by make}
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../observability/dashboards:/otel-lgtm/shop-dashboards:ro
      - ../observability/lgtm-dashboard-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/shop.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
