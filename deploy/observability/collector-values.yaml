# OpenTelemetry Collector (k8s distribution): OTLP/HTTP in from the API, one exporter per signal. The image comes from OTEL_COLLECTOR_IMAGE in
# deploy/versions.mk through --set. Receives on port 4318 only.
mode: deployment
fullnameOverride: otel-collector
command:
  name: otelcol-k8s
replicaCount: 1
ports:
  otlp:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: null
        http:
          endpoint: ${env:MY_POD_IP}:4318
  exporters:
    debug: null
    otlp/tempo:
      endpoint: tempo.obs.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki.obs.svc.cluster.local:3100/otlp
    otlphttp/prometheus:
      endpoint: http://prometheus-server.obs.svc.cluster.local:80/api/v1/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
