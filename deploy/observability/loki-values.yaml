# Single binary, filesystem storage on an emptyDir, no caches, no gateway. The OTLP endpoint is /otlp (Loki 3 native ingest).
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
  pattern_ingester:
    enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: false
  # The root filesystem is read-only and the chart mounts no volume at /var/loki without a PVC.
  extraVolumes:
    - name: loki-data
      emptyDir:
        sizeLimit: 1Gi
  extraVolumeMounts:
    - name: loki-data
      mountPath: /var/loki
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
gateway:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
