apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: obs
spec:
  parentRefs:
    - name: shop
      namespace: shop
      sectionName: http
  hostnames:
    - grafana.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
