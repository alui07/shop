apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [shop, obs]
    - name: idp
      protocol: HTTP
      port: 8089
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
spec:
  parentRefs:
    - name: shop
      sectionName: http
  rules:
    # Session minting exists only on the loadtest listener; the longest prefix wins over /api.
    - matches:
        - path:
            type: PathPrefix
            value: /api/loadtest
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: not-found
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /oauth2/
        - path:
            type: PathPrefix
            value: /login/oauth2/
        - path:
            type: Exact
            value: /logout
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-Forwarded-Host, Shop-Loadtest-Token]
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: not-found
  labels:
    app.kubernetes.io/part-of: shop
spec:
  directResponse:
    statusCode: 404
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/part-of: shop
spec:
  parentRefs:
    - name: shop
      sectionName: idp
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /realms/shop/clients-registrations
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: not-found
    - matches:
        - path:
            type: PathPrefix
            value: /realms/shop
        - path:
            type: PathPrefix
            value: /resources
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [X-Forwarded-Host]
      backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shop
  # Nothing sits in front of the gateway: the client address is the connection's peer, and a client-sent X-Forwarded-For is not trusted.
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 0
  headers:
    # Removed before Envoy appends the peer, so upstreams see exactly one X-Forwarded-For entry, the real peer.
    earlyRequestHeaders:
      remove:
        - X-Forwarded-For
        - X-Real-IP
        - Forwarded
        - x-envoy-original-path
        - X-Forwarded-Port
        - X-Forwarded-Prefix
    disableRateLimitHeaders: true
