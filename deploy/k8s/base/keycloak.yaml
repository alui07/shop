apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # An import with --override true needs every other Keycloak node stopped, so no surge pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: shop
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Re-creates the realm from the baked file on every pod start: new signing keys, SSO sessions lost (ADR 0006).
        - name: import
          image: shop-keycloak
          command:
            - bash
            - -c
            - ': "${SHOP_AUTH_CLIENT_SECRET:?}" "${SHOP_PUBLIC_ORIGIN:?}"; exec /opt/keycloak/bin/kc.sh import --dir /opt/keycloak/data/import --override true --optimized'
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db-rw:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: password
            - name: KC_CACHE
              value: local
            - name: SHOP_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shop-auth
                  key: SHOP_AUTH_CLIENT_SECRET
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:MaxRAMPercentage=65
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-tmp
              mountPath: /opt/keycloak/data/tmp
      containers:
        - name: keycloak
          image: shop-keycloak
          command:
            - bash
            - -c
            - ': "${KC_DB_PASSWORD:?}" "${KC_HOSTNAME:?}"; exec /opt/keycloak/bin/kc.sh start --optimized'
          env:
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db-rw:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: password
            - name: KC_HTTP_ENABLED
              value: 'true'
            - name: KC_CACHE
              value: local
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:MaxRAMPercentage=65
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 48
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-tmp
              mountPath: /opt/keycloak/data/tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: data-tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: shop
  ports:
    - name: http
      port: 8080
      targetPort: http
