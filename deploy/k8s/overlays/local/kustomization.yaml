apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - envoy-proxy.yaml
images:
  - name: shop-api
    newName: shop/api
    newTag: dev
  - name: shop-web
    newName: shop/web
    newTag: dev
patches:
  - target:
      kind: Gateway
      name: shop
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: shop
      spec:
        infrastructure:
          parametersRef:
            group: gateway.envoyproxy.io
            kind: EnvoyProxy
            name: shop-proxy
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          metadata:
            annotations:
              shop.dev/image-id: api-image-id-placeholder
          spec:
            containers:
              - name: api
                imagePullPolicy: Never
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: seed
  - target:
      kind: Deployment
      name: web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        template:
          metadata:
            annotations:
              shop.dev/image-id: web-image-id-placeholder
          spec:
            containers:
              - name: web
                imagePullPolicy: Never
