# Session minting for k6: the loadtest profile, its token, a listener on 8090 that routes only the mint request, and a faster Valkey.
# Only overlays/loadtest and the overlays built on it include this; lint guards keep it out of local and obs.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - route.yaml
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          metadata:
            annotations:
              shop.dev/shop-loadtest-hash: shop-loadtest-hash-placeholder
          spec:
            containers:
              - name: api
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: seed,loadtest
                  - name: SHOP_LOADTEST_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: shop-loadtest
                        key: SHOP_LOADTEST_TOKEN
                  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
                    value: '0.1'
  - target:
      kind: Deployment
      name: valkey
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: valkey
      spec:
        template:
          spec:
            containers:
              - name: valkey
                resources:
                  limits:
                    cpu: '1'
  - target:
      kind: Gateway
      name: shop
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: loadtest
          protocol: HTTP
          port: 8090
          allowedRoutes:
            namespaces:
              from: Same
  # JSON6902 add: a strategic merge on this CRD field would replace the whole port list.
  - target:
      kind: EnvoyProxy
      name: shop-proxy
    patch: |-
      - op: add
        path: /spec/provider/kubernetes/envoyService/patch/value/spec/ports/-
        value:
          port: 8090
          name: loadtest
          nodePort: 30090
