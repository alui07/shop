apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - network-policy.yaml
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
                    value: 'true'
                  - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
                    value: 'true'
                  - name: MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED
                    value: 'true'
                  - name: MANAGEMENT_OTLP_METRICS_EXPORT_BASE_TIME_UNIT
                    value: seconds
                  - name: MANAGEMENT_OTLP_METRICS_EXPORT_STEP
                    value: 10s
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: http://otel-collector.obs.svc.cluster.local:4318
                  - name: OTEL_SERVICE_NAME
                    value: shop-api
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: OTEL_RESOURCE_ATTRIBUTES
                    value: deployment.environment=kind,service.instance.id=$(POD_NAME)
