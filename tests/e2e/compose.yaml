name: shop-e2e

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set by make}
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: dev-only-postgres-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ${API_IMAGE:?set by make}
    pull_policy: never
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: dev-only-postgres-password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/actuator/health/readiness']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  web:
    image: ${WEB_IMAGE:?set by make}
    pull_policy: never
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    image: ${NGINX_IMAGE:?set by make}
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 3s
      timeout: 3s
      retries: 20

  e2e:
    profiles: ['runner']
    image: ${PLAYWRIGHT_IMAGE:?set by make}
    user: '${HOST_UID:?set by make}:${HOST_GID:?set by make}'
    init: true
    shm_size: '1gb'
    working_dir: /e2e
    command: ['./node_modules/.bin/playwright', 'test']
    environment:
      HOME: /cache/home
      CI: 'true'
      E2E_BASE_URL: http://gateway:8080
      E2E_REPORT_DIR: /reports
    volumes:
      - .:/e2e:ro
      - ../../.cache/home:/cache/home
      - ../../build/reports/e2e:/reports
    depends_on:
      gateway:
        condition: service_healthy
