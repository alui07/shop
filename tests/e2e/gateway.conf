# Access logs carry the path only: query strings on the auth paths hold authorization codes and id_token_hint (C16).
log_format no_query '$remote_addr "$request_method $uri" $status $body_bytes_sent';

# The app front door, http://localhost:8088 in the browser. Forwarded headers are set here, never passed through (C15).
server {
  listen 8080;
  server_name _;
  access_log /dev/stdout no_query;

  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host "";

  location = /healthz {
    return 200;
  }

  location ~ ^/api(/|$) {
    proxy_pass http://api:8080;
  }

  location /oauth2/ {
    proxy_pass http://api:8080;
  }

  location /login/oauth2/ {
    proxy_pass http://api:8080;
  }

  location = /logout {
    proxy_pass http://api:8080;
  }

  location / {
    proxy_pass http://web:8080;
  }
}

# The identity provider's own origin, http://localhost:8089 in the browser. Only the realm and its static resources are routed.
server {
  listen 8089;
  server_name _;
  access_log /dev/stdout no_query;

  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header Host $http_host;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;

  location ^~ /realms/shop/clients-registrations/ {
    return 404;
  }

  location /realms/shop/ {
    proxy_pass http://keycloak:8080;
  }

  location /resources/ {
    proxy_pass http://keycloak:8080;
  }

  location / {
    return 404;
  }
}
