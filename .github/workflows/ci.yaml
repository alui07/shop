name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      UPLOAD_SARIF: ${{ github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Maven and pnpm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/m2
            .cache/pnpm
            .cache/home/.cache/pnpm
            .cache/kubeconform
          key: deps-${{ runner.os }}-${{ hashFiles('services/api/pom.xml', 'apps/web/pnpm-lock.yaml', 'tests/e2e/pnpm-lock.yaml', 'deploy/versions.mk') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Read the date for the daily Trivy database cache
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-${{ runner.os }}-${{ steps.date.outputs.day }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - run: make ci

      - name: Upload Trivy repo scan
        if: always() && env.UPLOAD_SARIF == 'true' && hashFiles('build/reports/trivy/fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build/reports/trivy/fs.sarif
          category: trivy-fs

      - name: Upload Trivy API image scan
        if: always() && env.UPLOAD_SARIF == 'true' && hashFiles('build/reports/trivy/api.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build/reports/trivy/api.sarif
          category: trivy-api

      - name: Upload Trivy web image scan
        if: always() && env.UPLOAD_SARIF == 'true' && hashFiles('build/reports/trivy/web.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build/reports/trivy/web.sarif
          category: trivy-web

      - name: Upload Trivy Keycloak image scan
        if: always() && env.UPLOAD_SARIF == 'true' && hashFiles('build/reports/trivy/keycloak.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build/reports/trivy/keycloak.sarif
          category: trivy-keycloak

      - name: Upload API test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-reports
          path: |
            services/api/target/failsafe-reports
            services/api/target/surefire-reports
            services/api/target/*.dump*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload end-to-end reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: build/reports/e2e
          if-no-files-found: ignore
          retention-days: 7

  cluster-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Maven and pnpm downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/m2
            .cache/pnpm
            .cache/home/.cache/pnpm
            .cache/kubeconform
          key: deps-${{ runner.os }}-${{ hashFiles('services/api/pom.xml', 'apps/web/pnpm-lock.yaml', 'tests/e2e/pnpm-lock.yaml', 'deploy/versions.mk') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - run: make cluster-up deploy cluster-e2e

      - name: Collect cluster diagnostics
        if: failure() || cancelled()
        run: make cluster-diagnostics

      - name: Upload cluster end-to-end reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-e2e-reports
          path: build/reports/cluster-e2e
          if-no-files-found: ignore
          retention-days: 7
